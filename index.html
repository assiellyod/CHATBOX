<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b5ce2">
  <meta name="description" content="CHATBOX private messaging interface">
  <title>CHATBOX — Private Messaging</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Conversations">
      <div class="sidebar-top">
        <div class="brand-row">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">CB</div>
            <div>
              <h1>CHATBOX</h1>
              <p>Private messaging</p>
            </div>
          </div>
          <button class="icon-button" type="button" data-theme-toggle aria-label="Use dark theme" title="Dark theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
            </svg>
          </button>
        </div>

        <button class="new-chat" type="button" data-new-chat>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          New conversation
        </button>
      </div>

      <label class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.2-3.2"/>
        </svg>
        <input type="search" placeholder="Search conversations" data-search autocomplete="off">
      </label>

      <div class="conversation-list">
        <button class="conversation active" type="button" data-name="Alex" data-avatar="A" data-user-id="usr_alex">
          <span class="avatar">A</span>
          <span class="conversation-info">
            <strong>Alex</strong>
            <small>Start a conversation</small>
          </span>
        </button>

        <button class="conversation" type="button" data-name="Jamie" data-avatar="J" data-user-id="usr_jamie">
          <span class="avatar">J</span>
          <span class="conversation-info">
            <strong>Jamie</strong>
            <small>No messages yet</small>
          </span>
        </button>
      </div>
    </aside>

    <button class="sidebar-overlay" type="button" aria-label="Close menu"></button>

    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-person">
          <button class="icon-button menu-button" type="button" data-menu-toggle aria-label="Open conversations">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
          </button>
          <div class="avatar header-avatar" data-active-avatar>A</div>
          <div>
            <h2 data-active-name>Alex</h2>
            <p><span class="online-dot"></span> Private conversation</p>
          </div>
        </div>
      </header>

      <section class="messages" aria-label="Messages">
        <div class="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/>
            </svg>
          </div>
          <h2>Your private chat</h2>
          <p>Send a message to start the conversation.</p>
        </div>
      </section>

      <form class="message-form">
        <input type="text" name="message" placeholder="Type a message..." autocomplete="off" data-message-input>
        <button type="submit" aria-label="Send message">
          <span>Send</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script src="api/client.js"></script>
  <script src="script.js"></script>
</body>
</html>

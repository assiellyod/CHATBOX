<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="CHATBOX private messaging interface">
  <title>CHATBOX — Private Messaging</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="h-full overflow-hidden bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-white">
  <div class="flex h-screen w-full">
    <aside
      class="fixed inset-y-0 left-0 z-40 flex w-80 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-200 lg:static lg:translate-x-0 dark:border-slate-800 dark:bg-slate-900"
      aria-label="Conversations"
      data-sidebar
    >
      <div class="border-b border-slate-200 p-5 dark:border-slate-800">
        <div class="flex items-center justify-between gap-3">
          <div class="flex min-w-0 items-center gap-3">
            <div class="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-indigo-600 font-bold text-white shadow-sm">CB</div>
            <div class="min-w-0">
              <h1 class="truncate text-lg font-bold tracking-tight">CHATBOX</h1>
              <p class="truncate text-xs text-slate-500 dark:text-slate-400">Private messaging</p>
            </div>
          </div>

          <button
            type="button"
            class="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-slate-200 text-slate-600 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
            data-theme-toggle
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
            </svg>
          </button>
        </div>

        <button
          type="button"
          class="mt-5 flex h-11 w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200 dark:focus:ring-indigo-950"
          data-new-chat
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          New conversation
        </button>
      </div>

      <div class="p-4">
        <label class="flex h-11 items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 focus-within:border-indigo-500 focus-within:ring-4 focus-within:ring-indigo-100 dark:border-slate-700 dark:bg-slate-800 dark:focus-within:ring-indigo-950">
          <svg class="h-5 w-5 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.2-3.2"/>
          </svg>
          <input
            type="search"
            placeholder="Search conversations"
            autocomplete="off"
            class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-slate-400"
            data-search
          >
        </label>
      </div>

      <div class="min-h-0 flex-1 overflow-y-auto px-4 pb-4" data-conversation-list>
        <div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 px-5 py-8 text-center dark:border-slate-700 dark:bg-slate-800/60">
          <div class="mx-auto grid h-11 w-11 place-items-center rounded-full bg-slate-200 text-slate-500 dark:bg-slate-700 dark:text-slate-300">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/>
            </svg>
          </div>
          <p class="mt-3 text-sm font-semibold">No conversations yet</p>
          <p class="mt-1 text-xs leading-5 text-slate-500 dark:text-slate-400">Real practice users can be added later.</p>
        </div>
      </div>
    </aside>

    <button
      type="button"
      class="fixed inset-0 z-30 hidden bg-slate-950/40 lg:hidden"
      aria-label="Close menu"
      data-sidebar-overlay
    ></button>

    <main class="flex min-w-0 flex-1 flex-col bg-white dark:bg-slate-950">
      <header class="flex h-16 shrink-0 items-center gap-3 border-b border-slate-200 px-4 sm:px-6 dark:border-slate-800 dark:bg-slate-900/70">
        <button
          type="button"
          class="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-slate-200 text-slate-600 lg:hidden dark:border-slate-700 dark:text-slate-300"
          data-menu-toggle
          aria-label="Open conversations"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>

        <div class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-slate-200 font-semibold text-slate-500 dark:bg-slate-800 dark:text-slate-300" data-active-avatar>—</div>
        <div class="min-w-0">
          <h2 class="truncate text-sm font-semibold sm:text-base" data-active-name>No conversation selected</h2>
          <p class="truncate text-xs text-slate-500 dark:text-slate-400">Choose a user when contacts are available</p>
        </div>
      </header>

      <section class="flex min-h-0 flex-1 items-center justify-center overflow-y-auto bg-slate-50 p-5 sm:p-8 dark:bg-slate-950" aria-label="Messages" data-messages>
        <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900">
          <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-indigo-50 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-300">
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/>
            </svg>
          </div>
          <h2 class="mt-4 text-lg font-bold">No conversations yet</h2>
          <p class="mt-2 text-sm leading-6 text-slate-500 dark:text-slate-400">Add real practice users later, then start a private conversation here.</p>
        </div>
      </section>

      <form class="flex shrink-0 gap-2 border-t border-slate-200 bg-white p-3 sm:p-4 dark:border-slate-800 dark:bg-slate-900" data-message-form>
        <input
          type="text"
          name="message"
          placeholder="Select a conversation first"
          autocomplete="off"
          disabled
          class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-slate-100 px-4 py-3 text-sm text-slate-500 outline-none disabled:cursor-not-allowed dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400"
          data-message-input
        >
        <button
          type="submit"
          disabled
          class="inline-flex items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 text-sm font-semibold text-white opacity-50 disabled:cursor-not-allowed"
        >
          <span class="hidden sm:inline">Send</span>
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script src="api/client.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b5ce2">
  <title>Create Account — CHATBOX</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .register-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
    .register-card{width:min(100%,460px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow);padding:28px}
    .register-card h1{margin:0 0 8px;font-size:28px;color:var(--text)}
    .register-card p{margin:0 0 24px;color:var(--muted)}
    .register-form{display:grid;gap:16px}
    .register-form label{display:grid;gap:7px;font-weight:600;color:var(--text)}
    .register-form input{width:100%;border:1px solid var(--line);background:var(--surface-soft);color:var(--text);border-radius:12px;padding:13px 14px;font:inherit;outline:none}
    .register-form input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
    .register-actions{display:grid;gap:10px;margin-top:4px}
    .register-submit,.back-link{min-height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;text-decoration:none}
    .register-submit{border:0;background:var(--primary);color:#fff;cursor:pointer}
    .register-submit:hover{background:var(--primary-strong)}
    .register-submit:disabled{opacity:.65;cursor:wait}
    .back-link{border:1px solid var(--line);color:var(--text);background:var(--surface)}
    .register-note{font-size:13px;color:var(--muted);margin-top:16px!important}
    .form-status{display:none;margin:0!important;padding:12px 14px;border-radius:12px;font-size:14px}
    .form-status.show{display:block}
    .form-status.error{background:#fff0f0;color:#b42318}
    .form-status.success{background:#ecfdf3;color:#027a48}
  </style>
</head>
<body>
  <main class="register-page">
    <section class="register-card" aria-labelledby="register-title">
      <h1 id="register-title">Create account</h1>
      <p>Set up a new CHATBOX profile.</p>

      <form class="register-form" id="registerForm">
        <label>Full name
          <input type="text" name="fullName" placeholder="Your name" maxlength="80" required>
        </label>

        <label>Email
          <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </label>

        <label>Password
          <input type="password" name="password" placeholder="Minimum 8 characters" minlength="8" autocomplete="new-password" required>
        </label>

        <label>Confirm password
          <input type="password" name="confirmPassword" placeholder="Repeat password" minlength="8" autocomplete="new-password" required>
        </label>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>

        <div class="register-actions">
          <button class="register-submit" type="submit">Create account</button>
          <a class="back-link" href="index.html">Back to CHATBOX</a>
        </div>
      </form>

      <p class="register-note">Practice mode: the database/API files live in GitHub, while created accounts are saved in this browser only.</p>
    </section>
  </main>

  <script src="api/client.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const statusBox = document.getElementById('formStatus');
    const submitButton = form.querySelector('button[type="submit"]');

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = `form-status show ${type}`;
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const data = new FormData(form);
      const fullName = data.get('fullName');
      const email = data.get('email');
      const password = data.get('password');
      const confirmPassword = data.get('confirmPassword');

      if (password !== confirmPassword) {
        showStatus('Passwords do not match.', 'error');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Creating account...';

      try {
        const user = await window.ChatboxAPI.register({ fullName, email, password });
        showStatus(`Welcome, ${user.displayName}. Account created on this browser.`, 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 650);
      } catch (error) {
        showStatus(error.message || 'Unable to create account.', 'error');
        submitButton.disabled = false;
        submitButton.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>

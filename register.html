<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6efd">
  <meta name="description" content="Register a practice CHATBOX user">
  <title>Register User — CHATBOX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="min-vh-100 bg-body-tertiary d-flex align-items-center py-4">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
              <span class="badge rounded-4 text-bg-primary fs-6 p-3">CB</span>
              <div>
                <h1 class="h4 fw-bold mb-1">Register user</h1>
                <p class="text-body-secondary mb-0">Add a practice user to CHATBOX.</p>
              </div>
            </div>

            <div class="alert d-none" role="alert" data-status></div>

            <form data-register-form>
              <div class="mb-3">
                <label for="displayName" class="form-label fw-semibold">Full name</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="displayName"
                  name="displayName"
                  minlength="2"
                  maxlength="80"
                  autocomplete="name"
                  required
                >
              </div>

              <div class="mb-4">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  id="email"
                  name="email"
                  autocomplete="email"
                  required
                >
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold" data-submit>
                  Register user
                </button>
                <a href="index.html" class="btn btn-outline-secondary btn-lg">Back to CHATBOX</a>
              </div>
            </form>

            <p class="small text-body-secondary text-center mt-4 mb-0">
              Practice mode: registered users are saved in this browser using localStorage.
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api/client.js"></script>
  <script>
    const form = document.querySelector('[data-register-form]');
    const statusBox = document.querySelector('[data-status]');
    const submitButton = document.querySelector('[data-submit]');

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = `alert alert-${type}`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const data = new FormData(form);
      submitButton.disabled = true;
      submitButton.textContent = 'Registering...';

      try {
        const user = await window.ChatboxAPI.registerUser({
          displayName: data.get('displayName'),
          email: data.get('email')
        });

        showStatus(`${user.displayName} was registered successfully.`, 'success');
        form.reset();

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 700);
      } catch (error) {
        showStatus(error.message || 'Unable to register user.', 'danger');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Register user';
      }
    });
  </script>
</body>
</html>
